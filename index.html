<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ONYX</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ONYX">
  <meta name="theme-color" content="#05070a">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #05070a;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* ШАПКА */
    header {
      padding: max(14px, env(safe-area-inset-top)) 18px 12px;
      background: rgba(5, 7, 10, 0.85);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      font-size: 24px;
      font-weight: 950;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, #ffffff 40%, #00ff88 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .search-input-wrap {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 8px 12px;
      gap: 8px;
    }

    .search-input-wrap input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 14px;
      width: 100%;
      user-select: text;
      -webkit-user-select: text;
    }

    /* ОСНОВНОЙ КОНТЕНТ */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 140px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* БЛОК "МОЯ ВОЛНА" В СТИЛЕ ЯНДЕКС МУЗЫКИ */
    .wave-card {
      position: relative;
      border-radius: 24px;
      padding: 22px 20px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: 0 12px 35px rgba(0, 255, 136, 0.18);
      background: linear-gradient(125deg, #004d2c, #00ff88, #052617, #00bd67);
      background-size: 300% 300%;
      animation: waveFlow 8s ease infinite;
    }
    @keyframes waveFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .wave-content {
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .wave-title {
      font-size: 20px;
      font-weight: 950;
      letter-spacing: -0.01em;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .wave-subtitle {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 700;
    }

    .wave-orb {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      z-index: 2;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
      transition: transform 0.2s;
    }
    .wave-card:active .wave-orb {
      transform: scale(0.9);
    }

    /* СПИСОК ТРЕКОВ */
    .section-title {
      font-size: 15px;
      font-weight: 900;
      color: #94a3b8;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .track-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 10px 14px;
      border-radius: 16px;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }
    .track-card:active {
      background: rgba(0, 255, 136, 0.08);
      transform: scale(0.98);
    }
    .track-card.active {
      border-color: #00ff88;
      background: rgba(0, 255, 136, 0.1);
    }

    .track-thumb {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      object-fit: cover;
      background: #111;
      flex-shrink: 0;
    }

    .track-info {
      flex: 1;
      margin-left: 12px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .track-title {
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-author-row {
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ЗЕЛЕНЫЙ БЕЙДЖ ИНОАГЕНТА */
    .badge-agent {
      background: rgba(0, 255, 136, 0.15);
      border: 1px solid #00ff88;
      color: #00ff88;
      font-size: 9px;
      font-weight: 900;
      padding: 1px 6px;
      border-radius: 5px;
      letter-spacing: 0.04em;
    }

    /* МИНИ-ПЛЕЕР */
    #mini-player {
      display: none;
      position: fixed;
      bottom: max(14px, env(safe-area-inset-bottom));
      left: 12px;
      right: 12px;
      background: rgba(10, 14, 20, 0.92);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 8px 12px;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .btn-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #00ff88;
      color: #05070a;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }
    .btn-circle:active { transform: scale(0.92); }

    /* ПОЛНОЭКРАННЫЙ ПЛЕЕР */
    #full-player {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 10, 0.98);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      z-index: 200;
      flex-direction: column;
      justify-content: space-between;
      padding: max(20px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom));
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    /* ОФИЦИАЛЬНЫЙ ДИСКЛЕЙМЕР */
    #agent-disclaimer {
      display: none;
      background: rgba(0, 255, 136, 0.08);
      border: 1px solid rgba(0, 255, 136, 0.3);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 10px;
      color: #86efac;
      line-height: 1.4;
      text-align: center;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-top: 6px;
    }

    .slider-range {
      width: 100%;
      accent-color: #00ff88;
      margin: 10px 0 4px;
    }
  </style>
</head>
<body onclick="unlockAudio()">

  <header>
    <div class="top-row">
      <div class="brand-logo">ONYX</div>
      <span style="font-size: 12px; color: #00ff88; font-weight: 800;">HQ STREAM</span>
    </div>
    <div class="search-input-wrap">
      <span style="opacity: 0.5;">🔍</span>
      <input type="text" id="search-input" placeholder="Поиск треков..." oninput="handleSearch(this.value)">
    </div>
  </header>

  <main id="main-content">
    <!-- КАРТОЧКА МОЕЙ ВОЛНЫ -->
    <div class="wave-card" onclick="triggerMyWave()">
      <div class="wave-content">
        <div class="wave-title">
          <span>ONYX ВОЛНА</span>
          <span style="font-size:14px;">⚡</span>
        </div>
        <div class="wave-subtitle" id="wave-status">Бесконечный поток под настроение</div>
      </div>
      <div class="wave-orb" id="wave-orb-icon">▶</div>
    </div>

    <div class="section-title">Все треки</div>
    <div id="tracks-container" style="display:flex; flex-direction:column; gap:10px;"></div>
  </main>

  <!-- МИНИ-ПЛЕЕР -->
  <div id="mini-player" onclick="openFullPlayer()">
    <div style="display:flex; align-items:center; gap:10px; min-width:0;">
      <img id="mini-img" src="" class="track-thumb" style="width:42px;height:42px;">
      <div style="min-width:0;">
        <div id="mini-title" class="track-title" style="max-width:180px;">Трек</div>
        <div id="mini-artist" style="font-size:11px; color:#94a3b8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Исполнитель</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;" onclick="event.stopPropagation()">
      <button class="btn-circle" id="mini-play-btn" onclick="togglePlay()">▶</button>
    </div>
  </div>

  <!-- ПОЛНЫЙ ПЛЕЕР -->
  <div id="full-player">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <button onclick="closeFullPlayer()" style="background:none; border:none; color:#fff; font-size:24px; cursor:pointer;">✕</button>
      <span style="font-size:12px; font-weight:800; color:#64748b; letter-spacing:0.06em;">СЕЙЧАС ИГРАЕТ</span>
      <div style="width:24px;"></div>
    </div>

    <div style="display:flex; flex-direction:column; align-items:center; width:100%; gap:14px;">
      <img id="full-img" src="" style="width:260px; height:260px; border-radius:24px; object-fit:cover; box-shadow:0 15px 40px rgba(0,0,0,0.8);">

      <div style="text-align:center; width:100%;">
        <h2 id="full-title" style="font-size:20px; font-weight:900;">Трек</h2>
        <div style="display:flex; align-items:center; justify-content:center; gap:8px; margin-top:4px;">
          <span id="full-artist" style="font-size:14px; color:#94a3b8;">Исполнитель</span>
          <span id="full-agent-badge" class="badge-agent" style="display:none;">ИНОАГЕНТ</span>
        </div>
      </div>

      <div id="agent-disclaimer">
        ДАННОЕ СООБЩЕНИЕ (МАТЕРИАЛ) СОЗДАНО И (ИЛИ) РАСПРОСТРАНЕНО ИНОСТРАННЫМ АГЕНТОМ ЛИБО КАСАЕТСЯ ДЕЯТЕЛЬНОСТИ ИНОСТРАННОГО АГЕНТА. 18+
      </div>

      <div style="width:100%; max-width:320px;">
        <input type="range" id="seek-bar" class="slider-range" min="0" max="100" value="0" oninput="onSeekChange(this.value)">
        <div style="display:flex; justify-content:space-between; font-size:11px; color:#64748b; font-weight:700;">
          <span id="time-curr">0:00</span>
          <span id="time-dur">0:00</span>
        </div>
      </div>
    </div>

    <div style="display:flex; align-items:center; justify-content:center; gap:36px; margin-bottom:12px;">
      <button onclick="prevTrack()" style="background:none; border:none; color:#fff; font-size:28px; cursor:pointer;">⏮</button>
      <button class="btn-circle" id="full-play-btn" style="width:68px; height:68px; font-size:24px;" onclick="togglePlay()">▶</button>
      <button onclick="nextTrack()" style="background:none; border:none; color:#fff; font-size:28px; cursor:pointer;">⏭</button>
    </div>
  </div>

  <audio id="audio-engine" preload="auto"></audio>

  <script>
    /* -------------------------------------------------------------
       КАТАЛОГ С ТОЧНЫМИ ФАЙЛАМИ ИЗ ТВОЕГО РЕПОЗИТОРИЯ
       ------------------------------------------------------------- */
    const TRACKS = [
      {
        id: "monetochka_monopoly",
        title: "Монополия",
        artist: "Монеточка",
        isForeignAgent: true,
        cover: "IMG_2445.jpeg",
        src: encodeURIComponent("Монеточка - Монополия.mp3")
      }
    ];

    const audio = document.getElementById('audio-engine');
    let currentIndex = 0;
    let isPlaying = false;
    let isWaveActive = false;

    function unlockAudio() {
      if (audio.paused && !audio.src) {
        audio.src = TRACKS[0].src;
      }
    }

    function renderList(list) {
      const container = document.getElementById('tracks-container');
      container.innerHTML = '';

      list.forEach((t) => {
        const globalIdx = TRACKS.findIndex(x => x.id === t.id);
        const isCurrent = (globalIdx === currentIndex && isPlaying);

        const card = document.createElement('div');
        card.className = `track-card ${isCurrent ? 'active' : ''}`;
        card.onclick = () => {
          isWaveActive = false;
          playTrack(globalIdx);
        };

        const badge = t.isForeignAgent ? `<span class="badge-agent">ИНОАГЕНТ</span>` : '';

        card.innerHTML = `
          <img src="${t.cover}" class="track-thumb">
          <div class="track-info">
            <div class="track-title">${t.title}</div>
            <div class="track-author-row">
              <span>${t.artist}</span>
              ${badge}
            </div>
          </div>
          <span style="font-size:14px; color:#00ff88;">${isCurrent ? '🔊' : '▶'}</span>
        `;
        container.appendChild(card);
      });
    }

    function playTrack(idx) {
      currentIndex = idx;
      const t = TRACKS[currentIndex];
      audio.src = t.src;
      audio.play().then(() => {
        isPlaying = true;
        updateUI();
      }).catch(err => console.log('Audio error:', err));
    }

    function togglePlay() {
      if (audio.paused) {
        if (!audio.src) audio.src = TRACKS[currentIndex].src;
        audio.play();
        isPlaying = true;
      } else {
        audio.pause();
        isPlaying = false;
      }
      updateUI();
    }

    function triggerMyWave() {
      isWaveActive = true;
      const randomIdx = Math.floor(Math.random() * TRACKS.length);
      playTrack(randomIdx);
    }

    function prevTrack() {
      currentIndex = (currentIndex - 1 + TRACKS.length) % TRACKS.length;
      playTrack(currentIndex);
    }

    function nextTrack() {
      if (isWaveActive) {
        let nextIdx = Math.floor(Math.random() * TRACKS.length);
        if (TRACKS.length > 1 && nextIdx === currentIndex) {
          nextIdx = (currentIndex + 1) % TRACKS.length;
        }
        playTrack(nextIdx);
      } else {
        currentIndex = (currentIndex + 1) % TRACKS.length;
        playTrack(currentIndex);
      }
    }

    function updateUI() {
      const t = TRACKS[currentIndex];
      if (!t) return;

      // Мини-плеер
      const mini = document.getElementById('mini-player');
      mini.style.display = 'flex';
      document.getElementById('mini-title').innerText = t.title;
      document.getElementById('mini-artist').innerText = t.artist + (t.isForeignAgent ? ' [ИНОАГЕНТ]' : '');
      document.getElementById('mini-img').src = t.cover;
      document.getElementById('mini-play-btn').innerText = isPlaying ? '⏸' : '▶';

      // Полноэкранный плеер
      document.getElementById('full-title').innerText = t.title;
      document.getElementById('full-artist').innerText = t.artist;
      document.getElementById('full-img').src = t.cover;
      document.getElementById('full-play-btn').innerText = isPlaying ? '⏸' : '▶';

      // Плашка и бейдж
      const agentBadge = document.getElementById('full-agent-badge');
      const disclaimer = document.getElementById('agent-disclaimer');

      if (t.isForeignAgent) {
        agentBadge.style.display = 'inline-block';
        disclaimer.style.display = 'block';
      } else {
        agentBadge.style.display = 'none';
        disclaimer.style.display = 'none';
      }

      // Статус Волны
      const waveOrb = document.getElementById('wave-orb-icon');
      const waveStatus = document.getElementById('wave-status');
      if (isWaveActive && isPlaying) {
        waveOrb.innerText = '⚡';
        waveStatus.innerText = 'Сейчас играет персональная подборка';
      } else {
        waveOrb.innerText = '▶';
        waveStatus.innerText = 'Бесконечный поток под настроение';
      }

      renderList(TRACKS);
    }

    audio.ontimeupdate = () => {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      document.getElementById('seek-bar').value = pct;

      const m = Math.floor(audio.currentTime / 60);
      const s = Math.floor(audio.currentTime % 60).toString().padStart(2, '0');
      document.getElementById('time-curr').innerText = `${m}:${s}`;

      const dm = Math.floor(audio.duration / 60);
      const ds = Math.floor(audio.duration % 60).toString().padStart(2, '0');
      document.getElementById('time-dur').innerText = `${dm}:${ds}`;
    };

    audio.onended = () => nextTrack();

    function onSeekChange(v) {
      if (!audio.duration) return;
      audio.currentTime = (v / 100) * audio.duration;
    }

    function openFullPlayer() { document.getElementById('full-player').style.display = 'flex'; }
    function closeFullPlayer() { document.getElementById('full-player').style.display = 'none'; }

    function handleSearch(q) {
      const filtered = TRACKS.filter(t =>
        t.title.toLowerCase().includes(q.toLowerCase()) ||
        t.artist.toLowerCase().includes(q.toLowerCase())
      );
      renderList(filtered);
    }

    renderList(TRACKS);
  </script>
</body>
</html>
