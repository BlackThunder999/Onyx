<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ONYX</title>

  <!-- PWA & Favicon -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ONYX">
  <meta name="theme-color" content="#030507">

  <link rel="apple-touch-icon" href="./IMG_2448.jpeg">
  <link rel="apple-touch-icon" sizes="180x180" href="./IMG_2448.jpeg">
  <link rel="icon" type="image/jpeg" href="./IMG_2448.jpeg">

  <style>
    :root {
      --bg: #030507;
      --card: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.07);
      --accent: #00ff88;
      --accent-glow: rgba(0, 255, 136, 0.25);
      --text-main: #f8fafc;
      --text-muted: #64748b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      overflow: hidden;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: max(16px, env(safe-area-inset-top)) 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: linear-gradient(180deg, rgba(3, 5, 7, 0.95), transparent);
      z-index: 20;
    }

    .brand-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: cover;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .brand-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.1em;
      color: #fff;
    }

    /* УМНЫЙ ПОИСК */
    .search-container {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 16px 12px 42px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.25s ease;
      user-select: text;
      -webkit-user-select: text;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
      background: rgba(255, 255, 255, 0.05);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      width: 16px;
      height: 16px;
      stroke: var(--text-muted);
      stroke-width: 2;
      fill: none;
    }

    /* ОСНОВНАЯ ЧАСТЬ */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px 120px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ОНИКС ВОЛНА С CANVAS */
    .wave-wrapper {
      position: relative;
      border-radius: 28px;
      height: 220px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid rgba(0, 255, 136, 0.15);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      background: #000;
    }

    canvas#wave-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .wave-overlay {
      position: absolute;
      inset: 0;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(3,5,7,0.3) 0%, rgba(3,5,7,0.8) 100%);
      pointer-events: none;
    }

    .wave-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      letter-spacing: 0.08em;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
    }

    .wave-title {
      font-size: 26px;
      font-weight: 900;
      color: #fff;
      line-height: 1.1;
    }

    .wave-status-desc {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .wave-btn {
      align-self: flex-end;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(0, 255, 136, 0.6);
      pointer-events: auto;
    }

    /* ПОИСКОВАЯ ВЫДАЧА */
    #search-results-box {
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .result-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--card-border);
      cursor: pointer;
    }

    .result-card:active {
      transform: scale(0.98);
      background: rgba(0, 255, 136, 0.08);
    }

    .result-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .result-thumb {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      object-fit: cover;
    }

    .result-info {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .result-title {
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ВЕКТОРНЫЙ БЕЙДЖ ИНОАГЕНТА */
    .agent-shield-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      background: rgba(0, 255, 136, 0.08);
      border: 1px solid rgba(0, 255, 136, 0.35);
      border-radius: 6px;
      font-size: 9px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.04em;
    }

    /* ПЛАВАЮЩИЙ МИНИ-ПЛЕЕР */
    #mini-player {
      display: none;
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 16px;
      right: 16px;
      background: rgba(9, 13, 19, 0.85);
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 8px 12px;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      cursor: pointer;
    }

    /* ЭКРАН ПОЛНОГО ПЛЕЕРА */
    #full-player {
      display: none;
      position: fixed;
      inset: 0;
      background: #030507;
      z-index: 200;
      flex-direction: column;
      justify-content: space-between;
      padding: max(20px, env(safe-area-inset-top)) 24px max(34px, env(safe-area-inset-bottom));
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .player-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cover-box {
      width: 280px;
      height: 280px;
      margin: 0 auto;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px var(--accent-glow);
      position: relative;
    }

    .cover-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ВЕКТОРНАЯ ВОЛНА-ЭКВАЛАЙЗЕР */
    .visualizer-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 28px;
      margin-top: 10px;
    }

    .viz-bar {
      width: 3px;
      background: var(--accent);
      border-radius: 4px;
      height: 4px;
      transition: height 0.1s ease;
    }

    /* ПОЛОСА ЗВУКА */
    .progress-bar-wrap {
      width: 100%;
      position: relative;
      cursor: pointer;
      padding: 10px 0;
    }

    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00ff88, #86efac);
      box-shadow: 0 0 10px var(--accent);
      border-radius: 10px;
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 700;
      margin-top: 6px;
    }

    /* ДИСКЛЕЙМЕР */
    #agent-warning-box {
      display: none;
      background: rgba(0, 255, 136, 0.05);
      border: 1px solid rgba(0, 255, 136, 0.25);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 9px;
      color: #86efac;
      text-align: center;
      line-height: 1.35;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .svg-btn {
      background: none;
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body onclick="unlockAudioSystem()">

  <header>
    <div class="brand-bar">
      <div class="brand">
        <img src="./IMG_2448.jpeg" class="brand-icon">
        <span class="brand-title">ONYX</span>
      </div>
      <div class="agent-shield-badge">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        VERIFIED
      </div>
    </div>

    <!-- Умный поиск (по мыслям, настроению, названию) -->
    <div class="search-container">
      <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="smart-search" class="search-input" placeholder="Найти по словам, настроению или смыслу..." oninput="handleSmartSearch(this.value)">
    </div>
  </header>

  <main>
    <!-- Живая волна Onyx -->
    <div class="wave-wrapper" onclick="toggleWavePlay()">
      <canvas id="wave-canvas"></canvas>
      <div class="wave-overlay">
        <div>
          <div class="wave-badge">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            ONYX FLOW
          </div>
          <div class="wave-title">Моя Волна</div>
          <div class="wave-status-desc" id="wave-desc">Подбираем трек под вайб...</div>
        </div>

        <div class="wave-btn" id="wave-btn-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#030507"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </div>
      </div>
    </div>

    <!-- Результаты поиска (скрыты, пока пользователь не пишет запрос) -->
    <div id="search-results-box">
      <div style="font-size: 13px; font-weight: 800; color: var(--text-muted); text-transform: uppercase;">Найдено для вас</div>
      <div id="results-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
    </div>
  </main>

  <!-- Мини-плеер -->
  <div id="mini-player" onclick="openFullPlayer()">
    <div style="display:flex; align-items:center; gap:12px; min-width:0;">
      <img id="mini-img" class="result-thumb" src="">
      <div style="min-width:0;">
        <div id="mini-title" class="result-title" style="max-width:180px;"></div>
        <div id="mini-artist" class="result-meta"></div>
      </div>
    </div>
    <button class="svg-btn" onclick="event.stopPropagation(); togglePlay();" style="width:40px;height:40px;background:var(--accent);border-radius:50%;">
      <svg id="mini-play-svg" width="18" height="18" viewBox="0 0 24 24" fill="#030507"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    </button>
  </div>

  <!-- Полноэкранный плеер -->
  <div id="full-player">
    <div class="player-header">
      <button class="svg-btn" onclick="closeFullPlayer()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div style="font-size:11px; font-weight:800; letter-spacing:0.08em; color:var(--text-muted);">ИГРАЕТ СЕЙЧАС</div>
      <div style="width:24px;"></div>
    </div>

    <div class="cover-box">
      <img id="full-img" src="">
    </div>

    <div style="display:flex; flex-direction:column; gap:8px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-end;">
        <div>
          <div id="full-title" style="font-size:22px; font-weight:900;"></div>
          <div style="display:flex; align-items:center; gap:8px; margin-top:4px;">
            <span id="full-artist" style="font-size:14px; color:var(--text-muted);"></span>
            <!-- ВЕКТОРНЫЙ ЗНАЧОК ИНОАГЕНТА -->
            <div id="full-agent-badge" class="agent-shield-badge" style="display:none;">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              ИНОАГЕНТ
            </div>
          </div>
        </div>
      </div>

      <!-- Векторный эквалайзер полос звука -->
      <div class="visualizer-strip" id="visualizer-strip"></div>

      <!-- Предупреждение -->
      <div id="agent-warning-box">
        МАТЕРИАЛ СОЗДАН И РАСПРОСТРАНЕН ИНОСТРАННЫМ АГЕНТОМ. 18+
      </div>

      <!-- Лента трека -->
      <div class="progress-bar-wrap" onclick="seekByClick(event)">
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div class="time-labels">
          <span id="curr-time">0:00</span>
          <span id="dur-time">0:00</span>
        </div>
      </div>
    </div>

    <!-- Управление (SVG) -->
    <div style="display:flex; align-items:center; justify-content:space-around; margin-bottom:12px;">
      <button class="svg-btn" onclick="prevTrack()">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
      </button>

      <button class="svg-btn" onclick="togglePlay()" style="width:68px; height:68px; background:var(--accent); border-radius:50%; box-shadow:0 0 30px var(--accent-glow);">
        <svg id="full-play-svg" width="28" height="28" viewBox="0 0 24 24" fill="#030507"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </button>

      <button class="svg-btn" onclick="nextTrack()">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      </button>
    </div>
  </div>

  <audio id="audio" preload="auto"></audio>

  <script>
    /* БАЗА ТРЕКОВ С СЕМАНТИЧЕСКИМИ ТЕГАМИ */
    const TRACKS = [
      {
        id: "monetochka_monopoly",
        title: "Монополия",
        artist: "Монеточка",
        isForeignAgent: true,
        cover: "./IMG_2445.jpeg",
        src: encodeURIComponent("Монеточка - Монополия.mp3"),
        tags: ["девушка", "поп", "деньги", "игра", "ирония", "грусть", "россия", "монеточка", "монополия"]
      },
      {
        id: "gazan_67",
        title: "67",
        artist: "Газан",
        isForeignAgent: false,
        cover: "./IMG_2450.jpeg",
        src: "69cad99888c50.mp3",
        tags: ["газан", "кач", "бас", "клуб", "число", "тренировка", "энергия", "тачка", "67"]
      }
    ];

    const audio = document.getElementById('audio');
    let currentIndex = 0;
    let isPlaying = false;
    let isWaveActive = false;

    /* РАЗБЛОКИРОВКА WEB AUDIO НА IOS */
    function unlockAudioSystem() {
      if (audio.paused && !audio.src) {
        audio.src = TRACKS[0].src;
      }
    }

    /* ПОСТРОЕНИЕ ПОЛОС ЭКВАЛАЙЗЕРА */
    const vizContainer = document.getElementById('visualizer-strip');
    const BAR_COUNT = 28;
    for (let i = 0; i < BAR_COUNT; i++) {
      const bar = document.createElement('div');
      bar.className = 'viz-bar';
      vizContainer.appendChild(bar);
    }
    const bars = document.querySelectorAll('.viz-bar');

    function animateVisualizer() {
      if (isPlaying) {
        bars.forEach(b => {
          const h = Math.floor(Math.random() * 24) + 4;
          b.style.height = `${h}px`;
        });
      } else {
        bars.forEach(b => b.style.height = '4px');
      }
      setTimeout(animateVisualizer, 100);
    }
    animateVisualizer();

    /* СЕМАНТИЧЕСКИЙ УМНЫЙ ПОИСК */
    function handleSmartSearch(query) {
      const q = query.trim().toLowerCase();
      const container = document.getElementById('search-results-box');
      const list = document.getElementById('results-list');

      if (!q) {
        container.style.display = 'none';
        return;
      }

      container.style.display = 'flex';
      list.innerHTML = '';

      // Поиск по совпадениям названия, артиста, мыслей и контекстных тегов
      const matches = TRACKS.filter(t => {
        const textMatch = t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q);
        const semanticMatch = t.tags && t.tags.some(tag => tag.includes(q) || q.includes(tag));
        return textMatch || semanticMatch;
      });

      if (matches.length === 0) {
        list.innerHTML = `<div style="font-size:13px; color:var(--text-muted); padding:10px 0;">Ничего не найдено по вашему описанию</div>`;
        return;
      }

      matches.forEach(t => {
        const idx = TRACKS.findIndex(x => x.id === t.id);
        const card = document.createElement('div');
        card.className = 'result-card';
        card.onclick = () => playTrack(idx);

        const badge = t.isForeignAgent ? `
          <div class="agent-shield-badge">
            <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            ИНОАГЕНТ
          </div>` : '';

        card.innerHTML = `
          <div class="result-left">
            <img src="${t.cover}" class="result-thumb">
            <div class="result-info">
              <div class="result-title">${t.title}</div>
              <div class="result-meta">
                <span>${t.artist}</span>
                ${badge}
              </div>
            </div>
          </div>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--accent)"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        `;
        list.appendChild(card);
      });
    }

    /* УПРАВЛЕНИЕ ВОСПРОИЗВЕДЕНИЕМ */
    function playTrack(idx) {
      currentIndex = idx;
      const t = TRACKS[currentIndex];
      audio.src = t.src;
      audio.play().then(() => {
        isPlaying = true;
        updateUI();
      }).catch(e => console.log(e));
    }

    function togglePlay() {
      if (!audio.src) {
        playTrack(currentIndex);
        return;
      }
      if (audio.paused) {
        audio.play();
        isPlaying = true;
      } else {
        audio.pause();
        isPlaying = false;
      }
      updateUI();
    }

    function toggleWavePlay() {
      isWaveActive = true;
      const randomIdx = Math.floor(Math.random() * TRACKS.length);
      playTrack(randomIdx);
    }

    function prevTrack() {
      currentIndex = (currentIndex - 1 + TRACKS.length) % TRACKS.length;
      playTrack(currentIndex);
    }

    function nextTrack() {
      if (isWaveActive) {
        let n = Math.floor(Math.random() * TRACKS.length);
        if (TRACKS.length > 1 && n === currentIndex) n = (currentIndex + 1) % TRACKS.length;
        playTrack(n);
      } else {
        currentIndex = (currentIndex + 1) % TRACKS.length;
        playTrack(currentIndex);
      }
    }

    function updateUI() {
      const t = TRACKS[currentIndex];
      if (!t) return;

      document.getElementById('mini-player').style.display = 'flex';
      document.getElementById('mini-title').innerText = t.title;
      document.getElementById('mini-artist').innerText = t.artist;
      document.getElementById('mini-img').src = t.cover;

      document.getElementById('full-title').innerText = t.title;
      document.getElementById('full-artist').innerText = t.artist;
      document.getElementById('full-img').src = t.cover;

      const playSvg = `<polygon points="5 3 19 12 5 21 5 3"/>`;
      const pauseSvg = `<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>`;

      document.getElementById('mini-play-svg').innerHTML = isPlaying ? pauseSvg : playSvg;
      document.getElementById('full-play-svg').innerHTML = isPlaying ? pauseSvg : playSvg;

      const badge = document.getElementById('full-agent-badge');
      const warning = document.getElementById('agent-warning-box');
      if (t.isForeignAgent) {
        badge.style.display = 'inline-flex';
        warning.style.display = 'block';
      } else {
        badge.style.display = 'none';
        warning.style.display = 'none';
      }

      document.getElementById('wave-desc').innerText = isPlaying 
        ? `Играет: ${t.artist} — ${t.title}`
        : `Нажмите для бесконечного потока`;
    }

    /* ПОЛОСА ЗВУКА И ВРЕМЯ */
    audio.ontimeupdate = () => {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      document.getElementById('progress-fill').style.width = pct + '%';

      const m = Math.floor(audio.currentTime / 60);
      const s = Math.floor(audio.currentTime % 60).toString().padStart(2, '0');
      document.getElementById('curr-time').innerText = `${m}:${s}`;

      const dm = Math.floor(audio.duration / 60);
      const ds = Math.floor(audio.duration % 60).toString().padStart(2, '0');
      document.getElementById('dur-time').innerText = `${dm}:${ds}`;
    };

    audio.onended = () => nextTrack();

    function seekByClick(e) {
      if (!audio.duration) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const pct = clickX / rect.width;
      audio.currentTime = pct * audio.duration;
    }

    function openFullPlayer() { document.getElementById('full-player').style.display = 'flex'; }
    function closeFullPlayer() { document.getElementById('full-player').style.display = 'none'; }

    /* ЖИВОЙ CANVAS ДЛЯ "МОЕЙ ВОЛНЫ" */
    const canvas = document.getElementById('wave-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, step = 0;

    function resizeCanvas() {
      width = canvas.width = canvas.offsetWidth;
      height = canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function renderWave() {
      ctx.clearRect(0, 0, width, height);
      step += isPlaying ? 0.035 : 0.01;

      // Рисуем 3 неоновые интерференционные волны
      for (let j = 0; j < 3; j++) {
        ctx.beginPath();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = j === 0 ? 'rgba(0, 255, 136, 0.7)' : (j === 1 ? 'rgba(0, 180, 255, 0.4)' : 'rgba(112, 0, 255, 0.3)');

        for (let x = 0; x < width; x += 4) {
          const y = height / 2 + Math.sin(x * 0.012 + step + j) * 25 * Math.cos(step * 0.5 + j);
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      requestAnimationFrame(renderWave);
    }
    renderWave();
  </script>
</body>
</html>
